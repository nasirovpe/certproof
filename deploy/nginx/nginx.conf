# ==============================================================================
# CertProof Minimal Perimeter Reverse Proxy Configuration (Nginx Example)
# ==============================================================================
# Architecture & Security Guarantees:
# 1. Strip and Replace Forwarding Headers:
#    Client-provided 'X-Forwarded-For' and 'X-Real-IP' headers are strictly
#    overwritten with the verified TCP remote address ($remote_addr).
# 2. Private Upstream Network:
#    Upstream Next.js container (web:3000) is placed on a private Docker bridge network.
#    Clients cannot bypass the reverse proxy to communicate with the app directly.
# 3. Distributed Edge Rate Limiting:
#    Protects Next.js authentication endpoints from brute force across horizontal instances.
# 4. Request Body Boundary:
#    Limits client upload payload to 32M (matching CertProof maximum client hash cap).
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Edge Rate Limiting Zones (Binary remote IP saves memory)
    limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=public_limit:10m rate=60r/m;

    upstream certproof_upstream {
        server web:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Maximum certificate upload payload bound
        client_max_body_size 32M;

        # Hardened Security Response Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ----------------------------------------------------------------------
        # Rate-Limited Authentication Challenge and Verification Endpoints
        # ----------------------------------------------------------------------
        location /api/auth/ {
            limit_req zone=api_auth_limit burst=5 nodelay;

            proxy_pass http://certproof_upstream;
            proxy_http_version 1.1;

            # Strip and replace spoofable client forwarding headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            proxy_set_header Connection "";
            proxy_buffering off;
        }

        # ----------------------------------------------------------------------
        # General Application Routes & Static Assets
        # ----------------------------------------------------------------------
        location / {
            limit_req zone=public_limit burst=20 nodelay;

            proxy_pass http://certproof_upstream;
            proxy_http_version 1.1;

            # Forward verified perimeter TCP address
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            proxy_set_header Connection "";
            proxy_buffering off;
        }
    }
}
